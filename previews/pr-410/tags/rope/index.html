<!DOCTYPE html><html lang="en" data-astro-cid-sckkx6r4> <head><script>(() => {
  const storageKey = 'theme';
  const className = 'dark';
  const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
  const validThemes = ['light', 'dark'];
  let currentPreference = (() => {
    try {
      const stored = localStorage.getItem(storageKey);
      if (stored && validThemes.includes(stored)) return stored;
    } catch (error) {
      console.warn('Unable to access localStorage for theme:', error);
    }
    return mediaQuery.matches ? 'dark' : 'light';
  })();

  const resolveTheme = (preference) => (preference === 'dark' ? 'dark' : 'light');

  const applyTheme = (preference) => {
    const effectiveTheme = resolveTheme(preference);
    document.documentElement.classList.toggle(className, effectiveTheme === 'dark');
    document.documentElement.dataset.theme = effectiveTheme;
    return effectiveTheme;
  };

  const dispatchChange = (preference) => {
    const resolved = document.documentElement.classList.contains(className) ? 'dark' : 'light';
    window.dispatchEvent(
      new CustomEvent('themechange', {
        detail: { theme: preference, resolved },
      }),
    );
  };

  applyTheme(currentPreference);

  window.__setTheme = (next) => {
    const preference = validThemes.includes(String(next)) ? String(next) : resolveTheme(currentPreference);
    currentPreference = preference;
    try {
      localStorage.setItem(storageKey, preference);
    } catch (error) {
      console.warn('Unable to persist theme selection:', error);
    }
    applyTheme(preference);
    dispatchChange(preference);
  };
})();</script><meta charset="UTF-8"><meta name="description" content="包含 RoPE 标签的文章列表，共 1 篇"><meta name="viewport" content="width=device-width"><link rel="icon" type="image/x-icon" href="/blog-preview/previews/pr-410/favicon.ico"><link rel="icon" type="image/png" sizes="32x32" href="/blog-preview/previews/pr-410/favicon-32x32.png"><link rel="icon" type="image/png" sizes="16x16" href="/blog-preview/previews/pr-410/favicon-16x16.png"><link rel="apple-touch-icon" sizes="180x180" href="/blog-preview/previews/pr-410/apple-touch-icon.png"><meta name="generator" content="Astro v5.16.6"><link rel="canonical" href="https://yuanlehome.github.io/blog-preview/previews/pr-410/tags/rope/"><meta property="og:title" content="RoPE | Tags | Yuanle Liu"><meta property="og:description" content="包含 RoPE 标签的文章列表，共 1 篇"><meta property="og:image" content="/blog-preview/previews/pr-410/placeholder-social.jpg"><meta property="og:type" content="article"><meta property="og:url" content="https://yuanlehome.github.io/blog-preview/previews/pr-410/tags/rope/"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="RoPE | Tags | Yuanle Liu"><meta name="twitter:description" content="包含 RoPE 标签的文章列表，共 1 篇"><meta name="twitter:image" content="/blog-preview/previews/pr-410/placeholder-social.jpg"><title>RoPE | Tags | Yuanle Liu</title><style>:root {
